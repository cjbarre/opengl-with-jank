name: build-linux

on:
  push:
    branches: [main, runtime-binary, lein-jank-build-system]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: linux-x86_64
    runs-on: ubuntu-24.04

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Track jank main, but key the cache by the resolved commit SHA so each
      # upstream change gets a fresh build.
      JANK_REF: main
      CLANG_VERSION: "23"
      # Bump CACHE_REV when jank's apt.llvm.org or libstdc++ pins shift
      # underneath us and the cached jank build needs invalidating.
      CACHE_REV: "v1"

    steps:
      - name: Checkout opengl-with-jank
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------------
      # System dependencies
      # ---------------------------------------------------------------------
      - name: Add apt.llvm.org repo
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/apt-llvm-org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm-org.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${CLANG_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq

      - name: Install build & runtime deps
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang-${CLANG_VERSION} clang-tools-${CLANG_VERSION} lld-${CLANG_VERSION} \
            llvm-${CLANG_VERSION}-dev libclang-${CLANG_VERSION}-dev \
            libclang-cpp${CLANG_VERSION}-dev libpolly-${CLANG_VERSION}-dev \
            cmake ninja-build pkg-config build-essential \
            leiningen bubblewrap libglfw3-dev \
            libssl-dev libboost-all-dev zlib1g-dev libffi-dev libxml2-dev \
            libtinfo-dev libzstd-dev \
            gcc-14 g++-14 libstdc++-14-dev \
            patchelf \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libglu1-mesa-dev libglew-dev \
            xvfb mesa-utils libgl1-mesa-dri \
            python3

      - name: Install Babashka
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          bb: latest

      # Capture the deb versions we just installed; cache invalidates if any move.
      - name: Capture toolchain versions for cache key
        id: tc
        run: |
          {
            echo "clang=$(dpkg-query -W -f='${Version}' clang-${CLANG_VERSION})"
            echo "libstdcxx=$(dpkg-query -W -f='${Version}' libstdc++-14-dev)"
            echo "libzstd=$(dpkg-query -W -f='${Version}' libzstd-dev)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve jank ref
        id: jank-ref
        run: |
          sha="$(git ls-remote https://github.com/jank-lang/jank "$JANK_REF" | awk '{print $1}')"
          if [[ -z "$sha" ]]; then
            echo "::error::unable to resolve jank ref: $JANK_REF"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved jank $JANK_REF -> $sha"

      # ---------------------------------------------------------------------
      # Build jank from source (cached)
      # ---------------------------------------------------------------------
      - name: Cache jank build
        id: cache-jank
        uses: actions/cache@v4
        with:
          path: ~/jank
          key: jank-${{ steps.jank-ref.outputs.sha }}-clang-${{ steps.tc.outputs.clang }}-libstdcxx-${{ steps.tc.outputs.libstdcxx }}-${{ env.CACHE_REV }}

      - name: Clone & build jank
        if: steps.cache-jank.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/jank-lang/jank ~/jank
          cd ~/jank
          git checkout "${{ steps.jank-ref.outputs.sha }}"
          git submodule update --init --recursive
          cd compiler+runtime
          export CC=clang-${CLANG_VERSION} CXX=clang++-${CLANG_VERSION}
          # CppInterop uses ceil/log2f without including cmath.
          ./bin/configure -G Ninja \
            -Djank_local_clang=OFF \
            -Dllvm_dir=/usr/lib/llvm-${CLANG_VERSION} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-include cmath" \
            -DCMAKE_EXE_LINKER_FLAGS=-lzstd
          cmake --build build -j "$(nproc)"

      - name: Symlink jank into PATH
        run: sudo ln -sf "$HOME/jank/compiler+runtime/build/jank" /usr/local/bin/jank

      - name: jank check-health
        run: jank check-health

      - name: Install engine source package
        working-directory: engine
        run: lein install

      - name: Test development networking
        run: JANK_REAL="${JANK_REAL:-$(command -v jank)}" PATH="$PWD/scripts/eager:$PATH" python3 scripts/smoke-test.py --cwd game --logs /tmp/sca-dev-net -- lein run --

      - name: Test development client
        run: JANK_REAL="${JANK_REAL:-$(command -v jank)}" PATH="$PWD/scripts/eager:$PATH" xvfb-run -a python3 scripts/smoke-test.py --graphics --cwd game --logs /tmp/sca-dev-graphics -- lein run --

      - name: Compile and package release
        working-directory: game
        run: ./scripts/package

      - name: Relocate release
        run: mv game/dist/sca /tmp/sca-release

      - name: Test release without jank on PATH
        run: python3 scripts/smoke-test.py --standalone --cwd /tmp --logs /tmp/sca-release-net -- /tmp/sca-release/sca_run

      - name: Test release client
        run: xvfb-run -a python3 scripts/smoke-test.py --standalone --graphics --cwd /tmp --logs /tmp/sca-release-graphics -- /tmp/sca-release/sca_run

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-linux-x86_64
          path: /tmp/sca-*/*.log
          if-no-files-found: ignore

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: sca-linux-x86_64
          path: /tmp/sca-release/
          retention-days: 14
