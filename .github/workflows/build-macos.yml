name: build-macos

on:
  push:
    branches: [main, runtime-binary, lein-jank-build-system]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: macos-arm64
    runs-on: macos-14   # Apple silicon, Sonoma

    env:
      # Track jank main, but key the cache by the resolved commit SHA so each
      # upstream change gets a fresh build.
      JANK_REF: main
      CACHE_REV: "v1"
      # Homebrew on Apple silicon
      HOMEBREW_PREFIX: /opt/homebrew
      DEVELOPER_DIR: /Library/Developer/CommandLineTools

    steps:
      - name: Checkout opengl-with-jank
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------------
      # System dependencies via Homebrew
      # ---------------------------------------------------------------------
      - name: Install brew deps
        id: brew-deps
        run: |
          # Skip `brew update` — slowest step, runners stay fairly current.
          brew install llvm cmake ninja boost openssl@3 zstd doctest leiningen borkdude/brew/babashka pkgconf glfw python
          echo "llvm=$(brew list --versions llvm | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          installed_major=$(/opt/homebrew/opt/llvm/bin/clang --version \
            | head -1 | grep -oE 'version [0-9]+' | awk '{print $2}')
          if [[ "$installed_major" != "23" ]]; then
            echo "::error::brew llvm is version $installed_major; this build requires LLVM 23"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Build jank against brew's LLVM (cached)
      # ---------------------------------------------------------------------
      # Invalidate the compiler cache when jank or its linked LLVM changes.
      - name: Resolve jank ref
        id: jank-ref
        run: |
          sha="$(git ls-remote https://github.com/jank-lang/jank "$JANK_REF" | awk '{print $1}')"
          if [[ -z "$sha" ]]; then
            echo "::error::unable to resolve jank ref: $JANK_REF"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved jank $JANK_REF -> $sha"

      - name: Cache jank build
        id: cache-jank
        uses: actions/cache@v4
        with:
          path: ~/jank
          key: jank-mac14-${{ steps.jank-ref.outputs.sha }}-llvm-${{ steps.brew-deps.outputs.llvm }}-${{ env.CACHE_REV }}

      - name: Clone & build jank (against brew LLVM)
        if: steps.cache-jank.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/jank-lang/jank ~/jank
          cd ~/jank
          git checkout "${{ steps.jank-ref.outputs.sha }}"
          git submodule update --init --recursive
          cd compiler+runtime
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$HOMEBREW_PREFIX/opt/llvm/bin/clang"
          export CXX="$HOMEBREW_PREFIX/opt/llvm/bin/clang++"
          export CXXFLAGS="-stdlib=libc++ -isysroot $SDKROOT -include cmath"
          ./bin/configure -G Ninja \
            -Djank_local_clang=OFF \
            -Dllvm_dir="$HOMEBREW_PREFIX/opt/llvm" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT="$SDKROOT"
          cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Symlink jank into PATH
        run: |
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$HOME/jank/compiler+runtime/build/jank" /usr/local/bin/jank

      - name: jank check-health
        run: jank check-health

      - name: Install engine source package
        working-directory: engine
        run: lein install

      - name: Test development networking
        run: JANK_REAL="${JANK_REAL:-$(command -v jank)}" PATH="$PWD/scripts/eager:$PATH" python3 scripts/smoke-test.py --cwd game --logs /tmp/sca-dev-net -- lein run --

      - name: Compile and package release
        working-directory: game
        run: ./scripts/package

      - name: Relocate release
        run: mv game/dist/sca /tmp/sca-release

      - name: Test release without jank on PATH
        run: python3 scripts/smoke-test.py --standalone --cwd /tmp --logs /tmp/sca-release-net -- /tmp/sca-release/sca_run

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-macos-arm64
          path: /tmp/sca-*/*.log
          if-no-files-found: ignore

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: sca-macos-arm64
          path: /tmp/sca-release/
          retention-days: 14
